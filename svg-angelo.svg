<svg xmlns="http://www.w3.org/2000/svg" width="800" height="50" viewBox="0 0 800 50">
    <defs>
        <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f3ff" />
            <stop offset="100%" stop-color="#ff00e5" />
        </linearGradient>
        
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <animate id="mainClock" attributeName="visibility" from="visible" to="visible" begin="0s; mainClock.end" dur="20s" fill="freeze" />

        <clipPath id="cp1">
            <rect x="20" y="0" width="0" height="50">
                <animate attributeName="width" from="0" to="240" begin="mainClock.begin + 0.1s" dur="0.8s" fill="freeze" />
                <animate attributeName="width" from="240" to="0" begin="mainClock.begin + 1.9s" dur="0.6s" fill="freeze" />
            </rect>
        </clipPath>
        <clipPath id="cp2">
            <rect x="20" y="0" width="0" height="50">
                <animate attributeName="width" from="0" to="570" begin="mainClock.begin + 2.8s" dur="1s" fill="freeze" />
                <animate attributeName="width" from="570" to="0" begin="mainClock.begin + 4.7s" dur="0.6s" fill="freeze" />
            </rect>
        </clipPath>
        <clipPath id="cp3">
            <rect x="20" y="0" width="0" height="50">
                <animate attributeName="width" from="0" to="590" begin="mainClock.begin + 5.6s" dur="1s" fill="freeze" />
                <animate attributeName="width" from="590" to="0" begin="mainClock.begin + 7.5s" dur="0.6s" fill="freeze" />
            </rect>
        </clipPath>
        <clipPath id="cp4">
            <rect x="20" y="0" width="0" height="50">
                <animate attributeName="width" from="0" to="460" begin="mainClock.begin + 8.4s" dur="0.8s" fill="freeze" />
                <animate attributeName="width" from="460" to="0" begin="mainClock.begin + 10.1s" dur="0.6s" fill="freeze" />
            </rect>
        </clipPath>
        <clipPath id="cp5">
            <rect x="20" y="0" width="0" height="50">
                <animate attributeName="width" from="0" to="625" begin="mainClock.begin + 11.0s" dur="1s" fill="freeze" />
                <animate attributeName="width" from="625" to="0" begin="mainClock.begin + 12.9s" dur="0.6s" fill="freeze" />
            </rect>
        </clipPath>
        <clipPath id="cp6">
            <rect x="20" y="0" width="0" height="50">
                <animate attributeName="width" from="0" to="570" begin="mainClock.begin + 13.8s" dur="1s" fill="freeze" />
                <animate attributeName="width" from="570" to="0" begin="mainClock.begin + 15.7s" dur="0.6s" fill="freeze" />
            </rect>
        </clipPath>
        <clipPath id="cp7">
            <rect x="20" y="0" width="0" height="50">
                <animate attributeName="width" from="0" to="460" begin="mainClock.begin + 16.6s" dur="0.8s" fill="freeze" />
                <animate attributeName="width" from="460" to="0" begin="mainClock.begin + 19.3s" dur="0.6s" fill="freeze" />
            </rect>
        </clipPath>
    </defs>

    <style>
        .term { font-family: 'Courier New', Consolas, Monaco, monospace; font-size: 18px; font-weight: bold; }
        .header { font-size: 26px; font-weight: 900; }
        .cyan { fill: #00f3ff; }
        .pink { fill: #ff00e5; }
        .purple { fill: #d944ff; }
        .green { fill: #00ff9d; }
        .yellow { fill: #fcee0a; }
        .sys { font-size: 12px; fill: #ff00e5; }
    </style>

    <text x="700" y="26" class="term sys" filter="url(#glow)">sys.online
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite" calcMode="discrete" />
    </text>

    <g class="term">
        
        <g visibility="hidden">
            <set attributeName="visibility" to="visible" begin="mainClock.begin" dur="2.6s" />
            <text x="20" y="32" class="header" fill="url(#cyberGrad)" filter="url(#glow)" clip-path="url(#cp1)">hey, its angelo</text>
            <rect x="20" y="8" width="12" height="28" fill="#00f3ff" filter="url(#glow)">
                <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.8s" repeatCount="indefinite" calcMode="discrete" />
                <animate attributeName="x" from="20" to="260" begin="mainClock.begin + 0.1s" dur="0.8s" fill="freeze" />
                <animate attributeName="x" from="260" to="20" begin="mainClock.begin + 1.9s" dur="0.6s" fill="freeze" />
            </rect>
        </g>

        <g visibility="hidden">
            <set attributeName="visibility" to="visible" begin="mainClock.begin + 2.7s" dur="2.7s" />
            <text x="20" y="32" class="cyan" clip-path="url(#cp2)">> initializing collaborative web development link...</text>
            <rect x="20" y="16" width="10" height="20" fill="#00f3ff" filter="url(#glow)">
                <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.8s" repeatCount="indefinite" calcMode="discrete" />
                <animate attributeName="x" from="20" to="590" begin="mainClock.begin + 2.8s" dur="1s" fill="freeze" />
                <animate attributeName="x" from="590" to="20" begin="mainClock.begin + 4.7s" dur="0.6s" fill="freeze" />
            </rect>
        </g>

        <g visibility="hidden">
            <set attributeName="visibility" to="visible" begin="mainClock.begin + 5.5s" dur="2.7s" />
            <text x="20" y="32" class="pink" clip-path="url(#cp3)">> simulating aquaponics + robotic ecosystem control...</text>
            <rect x="20" y="16" width="10" height="20" fill="#00f3ff" filter="url(#glow)">
                <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.8s" repeatCount="indefinite" calcMode="discrete" />
                <animate attributeName="x" from="20" to="610" begin="mainClock.begin + 5.6s" dur="1s" fill="freeze" />
                <animate attributeName="x" from="610" to="20" begin="mainClock.begin + 7.5s" dur="0.6s" fill="freeze" />
            </rect>
        </g>

        <g visibility="hidden">
            <set attributeName="visibility" to="visible" begin="mainClock.begin + 8.3s" dur="2.5s" />
            <text x="20" y="32" class="purple" clip-path="url(#cp4)">> deploying medical alert ai prototypes...</text>
            <rect x="20" y="16" width="10" height="20" fill="#00f3ff" filter="url(#glow)">
                <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.8s" repeatCount="indefinite" calcMode="discrete" />
                <animate attributeName="x" from="20" to="480" begin="mainClock.begin + 8.4s" dur="0.8s" fill="freeze" />
                <animate attributeName="x" from="480" to="20" begin="mainClock.begin + 10.1s" dur="0.6s" fill="freeze" />
            </rect>
        </g>

        <g visibility="hidden">
            <set attributeName="visibility" to="visible" begin="mainClock.begin + 10.9s" dur="2.7s" />
            <text x="20" y="32" class="green" clip-path="url(#cp5)">> processing arduino signals into intelligent behavior...</text>
            <rect x="20" y="16" width="10" height="20" fill="#00f3ff" filter="url(#glow)">
                <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.8s" repeatCount="indefinite" calcMode="discrete" />
                <animate attributeName="x" from="20" to="645" begin="mainClock.begin + 11.0s" dur="1s" fill="freeze" />
                <animate attributeName="x" from="645" to="20" begin="mainClock.begin + 12.9s" dur="0.6s" fill="freeze" />
            </rect>
        </g>

        <g visibility="hidden">
            <set attributeName="visibility" to="visible" begin="mainClock.begin + 13.7s" dur="2.7s" />
            <text x="20" y="32" class="yellow" clip-path="url(#cp6)">> training models: python | ml | ai | ocr | nlp...</text>
            <rect x="20" y="16" width="10" height="20" fill="#00f3ff" filter="url(#glow)">
                <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.8s" repeatCount="indefinite" calcMode="discrete" />
                <animate attributeName="x" from="20" to="590" begin="mainClock.begin + 13.8s" dur="1s" fill="freeze" />
                <animate attributeName="x" from="590" to="20" begin="mainClock.begin + 15.7s" dur="0.6s" fill="freeze" />
            </rect>
        </g>

        <g visibility="hidden">
            <set attributeName="visibility" to="visible" begin="mainClock.begin + 16.5s" dur="3.5s" />
            <text x="20" y="32" class="cyan" filter="url(#glow)" clip-path="url(#cp7)">> status: open for impact-driven builds...</text>
            <rect x="20" y="16" width="10" height="20" fill="#00f3ff" filter="url(#glow)">
                <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.8s" repeatCount="indefinite" calcMode="discrete" />
                <animate attributeName="x" from="20" to="480" begin="mainClock.begin + 16.6s" dur="0.8s" fill="freeze" />
                <animate attributeName="x" from="480" to="20" begin="mainClock.begin + 19.3s" dur="0.6s" fill="freeze" />
            </rect>
        </g>

    </g>
</svg>
